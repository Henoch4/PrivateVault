[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
broadcast = "broadcast"
cache_path = "cache"
fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
mainnet = "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_API_KEY}"
tenderly = "${TENDERLY_RPC_URL}"

[profile.default.optimizer]
runs = 200
enabled = true

[invariant]
runs = 256
depth = 10
fail_on_revert = true
