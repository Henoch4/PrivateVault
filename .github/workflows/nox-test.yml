name: Nox Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Nox test suite
        run: npx hardhat test

      - name: Print off-chain log on failure
        if: failure()
        run: |
          echo "--- offchain-services.log ---"
          cat offchain-services.log || true
          echo "--- end ---"
